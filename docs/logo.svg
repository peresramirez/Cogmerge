<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="cmt cmd">
<title id="cmt">Cogmerge</title>
<desc id="cmd">A brain whose interior is a git-merge glyph: two branches converging into one highlighted node.</desc>

<!--
  One idea, two colours. A brain at a glance; a git merge up close. The amber
  node is the join key: the one code surface where two developers' branches
  meet. No fills and no neutrals, so the same file reads on white and on
  near-black without a second variant.
-->

<g transform="translate(128 128)">
  <path d="M -78,-10 C -78,-42 -54,-60 -26,-54 C -17,-70 13,-74 26,-62 C 44,-72 72,-60 76,-40
           C 96,-32 99,-3 84,10 C 92,32 73,55 50,51 C 38,68 8,71 -6,57 C -31,66 -60,52 -62,28
           C -82,21 -85,-1 -78,-10 Z"
        fill="none" stroke="#6D4AFF" stroke-width="11" stroke-linejoin="round"/>
</g>

<!-- two branches converging into a shared trunk -->
<g fill="none" stroke="#6D4AFF" stroke-width="12" stroke-linecap="round">
  <path d="M 98,92 C 98,122 116,128 134,128"/>
  <path d="M 98,166 C 98,134 116,128 134,128"/>
  <path d="M 134,128 L 156,128"/>
</g>
<circle cx="98" cy="92"  r="12" fill="#6D4AFF"/>
<circle cx="98" cy="166" r="12" fill="#6D4AFF"/>

<!-- the join key -->
<circle cx="166" cy="128" r="16" fill="#FFB020"/>
</svg>
